<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="add_event.css">
</head>
<body>
     <!-- Navigation Bar -->
    <nav class="navbar">
        <h2 class="logo">EventEase</h2>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">View Events</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <!-- Page Heading -->
    <header class="page-header">
        <h1>Add New Event</h1>
        <p>Enter the details below to organize your event.</p>
    </header>

    <!-- Add Event Form -->
    <main class="form-container">
        <form id="event-form">

            <div class="form-group">
                <label for="event_name">Event Name</label>
                <input
                    type="text"
                    id="event_name"
                    name="event_name"
                    placeholder="Enter event name"
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="event_date">Event Date</label>
                    <input
                        type="date"
                        id="event_date"
                        name="event_date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="event_time">Event Time</label>
                    <input
                        type="time"
                        id="event_time"
                        name="event_time"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="venue">Venue</label>
                <input
                    type="text"
                    id="venue"
                    name="venue"
                    placeholder="Enter event location"
                    required
                >
            </div>

            <div class="form-group">
                <label for="category">Event Category</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="Birthday">Birthday</option>
                    <option value="Wedding">Wedding</option>
                    <option value="College">College Event</option>
                    <option value="Corporate">Corporate Event</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Event Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Describe your event..."
                ></textarea>
            </div>

            <div class="form-buttons">
                <button type="submit" class="save-btn">
                    Save Event
                </button>

                <a href="events.html" class="cancel-btn">
                    Cancel
                </a>
            </div>

        </form>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 EventEase | Event Management System</p>
    </footer>
    <script src="/app.js" defer></script>
</body>
</html>
