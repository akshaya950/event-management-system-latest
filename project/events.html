<body>
     <!-- Navigation Bar -->
    <nav class="navbar">
        <h2 class="logo">EventEase</h2>

        <div class="nav-links">

    <!-- Page Heading -->
    <header class="page-header">
        <h1>Manage Your Events</h1>

        <a href="add_event.html" class="add-btn">+ Add New Event</a>
        <a href="/interested_events.html">
    <button>Users Interested Events</button>
</a>

    <!-- Events Section -->
    <section class="events-section">

        <div class="section-heading">
            <h2>All Events</h2>
            <input
                type="search"
                id="search"
                placeholder="Search events..."
                aria-label="Search events"
            >
            <button id="completedBtn">Completed Events</button>
        </div>

        <div class="table-container">
            <table id="eventsTable">
                <thead>
                    <tr>
                        <th>Event Name</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Venue</th>
                        <th>Description</th>
                        <th>Actions</th>
                    
                    </tr>
                </thead>

                <tbody>
                </tbody>
            </table>
        </div>

        <p id="emptyMessage" class="empty-message" hidden>
            No events found.
        </p>

        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

    </section>

    <!-- Footer -->
