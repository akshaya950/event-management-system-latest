<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System - Logout</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <a href="/home.html" class="brand-link">
            <div class="logo-icon">📅</div>
            <span class="logo-text">Event Management System</span>
        </a>

        <div class="nav-links">
            <a href="/home.html" class="nav-link">Home</a>
            <a href="/events.html" class="nav-link">Events</a>
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
        </div>
    </nav>

    <!-- Logout Confirmation -->
    <main class="container">
        <div class="confirm-box">
            <div class="confirm-icon primary">👋</div>
            <h1>Log Out</h1>
            <p>Are you sure you want to log out of your session?</p>

            <div class="confirm-actions">
                <button type="button" class="btn btn-primary" id="confirm-logout">
                    Yes, Log Out
                </button>
                <a href="/dashboard.html" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Event Management System | Built with HTML, CSS, JS & FastAPI</p>
    </footer>

    <script src="/app.js" defer></script>
</body>
</html>
