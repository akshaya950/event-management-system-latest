<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System - Add Event</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <a href="/home.html" class="brand-link">
            <div class="logo-icon">📅</div>
            <span class="logo-text">Event Management System</span>
        </a>

        <div class="nav-links">
            <!-- Populated dynamically by app.js based on role -->
        </div>
    </nav>

    <!-- Page Content -->
    <main class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>Add New Event</h1>
                <p>Schedule a new event and configure participation details.</p>
            </div>

            <form id="event-form">
                <div class="form-group">
                    <label for="event_name">Event Title</label>
                    <input
                        type="text"
                        id="event_name"
                        name="event_name"
                        placeholder="e.g. Annual Tech Symposium"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="event_date">Event Date</label>
                        <input
                            type="date"
                            id="event_date"
                            name="event_date"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="event_time">Event Time</label>
                        <input
                            type="time"
                            id="event_time"
                            name="event_time"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="venue">Venue / Location</label>
                    <input
                        type="text"
                        id="venue"
                        name="venue"
                        placeholder="e.g. Main Auditorium / Seminar Hall A"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select event category...</option>
                        <option value="College">College Event</option>
                        <option value="Technical">Technical Symposium</option>
                        <option value="Cultural">Cultural Fest</option>
                        <option value="Sports">Sports Meet</option>
                        <option value="Corporate">Corporate Seminar</option>
                        <option value="Other">Food festival</option>
                        <option value="Other">other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Event Description</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Provide details about the event, rules, competitions, etc."
                    ></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        Save &amp; Publish Event
                    </button>
                    <a href="/events.html" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Event Management System | Built with HTML, CSS, JS & FastAPI</p>
    </footer>

    <script src="/app.js" defer></script>
</body>
</html>
