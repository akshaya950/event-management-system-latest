<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System - Register</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/home.html" class="brand-link">
            <div class="logo-icon">📅</div>
            <span class="logo-text">Event Management System</span>
        </a>

        <div class="nav-links">
            <a href="/home.html" class="nav-link">Home</a>
            <a href="/events.html" class="nav-link">Events</a>
            <a href="/about.html" class="nav-link">About</a>
            <a href="/login.html" class="btn btn-sm btn-secondary">Login</a>
        </div>
    </nav>

    <!-- Registration Card -->
    <main class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>Create Account</h1>
                <p>Register as an Attendee or an Event Administrator.</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Alex Johnson"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="e.g. alex@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="role">Account Role</label>
                    <select id="role" name="role" required>
                        <option value="user" selected>👤 Attendee / Participant (Register for events & get certificates)</option>
                        <option value="admin">👑 Event Administrator (Create, edit events & view attendees)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create password"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Re-enter password"
                            required
                            autocomplete="new-password"
                        >
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Create Account
                </button>
            </form>

            <div class="form-footer-text">
                Already have an account? <a href="/login.html">Login here</a>
            </div>
            <div class="form-footer-text" style="margin-top: 0.5rem;">
                <a href="/home.html">&larr; Back to Home</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Event Management System | Built with HTML, CSS, JS & FastAPI</p>
    </footer>

    <script src="/app.js" defer></script>
</body>
</html>
